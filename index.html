<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Rail Rush Runner</title>

<link rel="stylesheet" href="style.css">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0878d1">
</head>

<body>

<div id="game">

<!-- =========================
GAME WORLD
========================== -->

<div id="sky"></div>

<div id="city">

<div class="building b1"></div>
<div class="building b2"></div>
<div class="building b3"></div>
<div class="building b4"></div>
<div class="building b5"></div>
<div class="building b6"></div>

</div>

<!-- Background trees -->
<div id="trees">
🌴 🌳 🌴 🌳 🌴
</div>


<!-- =========================
RAILWAY TRACK
========================== -->

<div id="railway">

<div class="track track-left">
<div class="rail rail-a"></div>
<div class="rail rail-b"></div>
<div class="sleepers"></div>
</div>

<div class="track track-center">
<div class="rail rail-a"></div>
<div class="rail rail-b"></div>
<div class="sleepers"></div>
</div>

<div class="track track-right">
<div class="rail rail-a"></div>
<div class="rail rail-b"></div>
<div class="sleepers"></div>
</div>

</div>


<!-- =========================
GAME UI
========================== -->

<div id="topUI">

<div class="score-box">
<span>🏆</span>
<strong id="score">0</strong>
</div>

<div class="coin-box">
<span>🪙</span>
<strong id="coinCount">0</strong>
</div>

<button id="soundButton">🔊</button>

</div>


<!-- =========================
PLAYER
========================== -->

<div id="player">

<div class="character">

<div class="head">😎</div>

<div class="body">
👕
</div>

<div class="legs">
👖
</div>

</div>

</div>


<!-- =========================
OBJECT CONTAINER
========================== -->

<div id="objects"></div>


<!-- =========================
START SCREEN
========================== -->

<div
id="startScreen"
class="screen"
>

<div class="logo">

<div class="logo-title">
RAIL RUSH
</div>

<div class="logo-subtitle">
ENDLESS RUNNER
</div>

</div>

<p>
Run • Jump • Change Lanes • Collect Coins
</p>

<button
id="startButton"
class="main-button"
>
▶ START RUN
</button>

<div class="instructions">

<div>⬅️ Swipe Left</div>

<div>➡️ Swipe Right</div>

<div>⬆️ Swipe Up to Jump</div>

</div>

</div>


<!-- =========================
GAME OVER SCREEN
========================== -->

<div
id="gameOverScreen"
class="screen hidden"
>

<div class="game-over-title">
RUN OVER!
</div>

<div class="results">

<p>
Score:
<strong id="finalScore">
0
</strong>
</p>

<p>
Coins:
<strong id="finalCoins">
0
</strong>
</p>

<p>
Best:
<strong id="bestScore">
0
</strong>
</p>

</div>

<button
id="restartButton"
class="main-button"
>
🔄 PLAY AGAIN
</button>

</div>


<!-- =========================
MOBILE CONTROLS
========================== -->

<div id="mobileControls">

<button id="leftButton">
◀
</button>

<button id="jumpButton">
▲
</button>

<button id="rightButton">
▶
</button>

</div>

</div>


<script src="script.js"></script>

</body>
</html>


</body>

</html>
