<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Shadow Run</title>

<link
rel="stylesheet"
href="style.css"
>

<!-- PWA -->
<link
rel="manifest"
href="manifest.json"
>

<meta
name="theme-color"
content="#0b0d12"
>

</head>


<body>


<div id="game">


<!-- =================================
GAME BACKGROUND
================================== -->

<div id="background">

<!-- Sky -->

<div id="sky"></div>


<!-- Moon -->

<div id="moon"></div>


<!-- Distant city -->

<div id="distantCity">

<div class="building"></div>
<div class="building"></div>
<div class="building"></div>
<div class="building"></div>
<div class="building"></div>
<div class="building"></div>
<div class="building"></div>

</div>


<!-- Street lights -->

<div id="streetLights">

<div class="street-light"></div>
<div class="street-light"></div>
<div class="street-light"></div>

</div>


<!-- Fog -->

<div id="fog"></div>

</div>



<!-- =================================
GAME WORLD
================================== -->

<div id="world">


<!-- Road -->

<div id="road">

<!-- Lane 1 -->

<div class="lane lane-one">

<div class="road-line"></div>

</div>


<!-- Lane 2 -->

<div class="lane lane-two">

<div class="road-line"></div>

</div>


<!-- Lane 3 -->

<div class="lane lane-three">

<div class="road-line"></div>

</div>

</div>



<!-- =================================
PURSUER
================================== -->

<div
id="pursuer"
aria-label="The pursuer"
>

<div class="pursuer-shadow"></div>

<div class="pursuer-body">

<div class="pursuer-head"></div>

<div class="pursuer-coat"></div>

</div>

</div>



<!-- =================================
PLAYER
================================== -->

<div
id="player"
class="player-lane-two"
>

<div class="player-shadow"></div>

<div class="runner">

<div class="runner-head"></div>

<div class="runner-body"></div>

<div class="runner-arm arm-left"></div>

<div class="runner-arm arm-right"></div>

<div class="runner-leg leg-left"></div>

<div class="runner-leg leg-right"></div>

</div>

</div>



<!-- =================================
DYNAMIC OBJECTS
================================== -->

<div id="objects">


<!-- Obstacles will be created
by JavaScript -->


</div>



<!-- =================================
ENERGY TOKENS
================================== -->

<div id="collectibles">


<!-- Tokens will be created
by JavaScript -->


</div>


</div>



<!-- =================================
TOP HUD
================================== -->

<header id="hud">


<!-- Distance -->

<div class="hud-item">

<span class="hud-label">
DISTANCE
</span>

<strong id="distance">
0 m
</strong>

</div>



<!-- Energy -->

<div class="hud-item energy">

<span class="hud-label">
ENERGY
</span>

<div class="energy-bar">

<div
id="energyFill"
class="energy-fill"
></div>

</div>

</div>



<!-- Score -->

<div class="hud-item">

<span class="hud-label">
SCORE
</span>

<strong id="score">
0
</strong>

</div>


</header>



<!-- =================================
START SCREEN
================================== -->

<section
id="startScreen"
class="screen"
>


<div class="title-container">

<p class="small-title">
A NEW CHASE BEGINS
</p>

<h1>
SHADOW
<span>
RUN
</span>
</h1>

<div class="title-line"></div>

<p class="description">

Run through the city.
Stay ahead.
Don't get caught.

</p>

</div>



<button
id="startButton"
class="primary-button"
>

START RUN

</button>



<div class="controls">

<div class="control">

<span>
← →
</span>

<small>
MOVE
</small>

</div>


<div class="control">

<span>
↑
</span>

<small>
JUMP
</small>

</div>


<div class="control">

<span>
SWIPE
</span>

<small>
MOBILE
</small>

</div>

</div>


</section>



<!-- =================================
GAME OVER
================================== -->

<section
id="gameOverScreen"
class="screen hidden"
>


<p class="small-title">
THE CHASE IS OVER
</p>


<h2>
YOU WERE
<span>
CAUGHT
</span>
</h2>


<div class="results">


<div class="result">

<span>
DISTANCE
</span>

<strong id="finalDistance">
0 m
</strong>

</div>


<div class="result">

<span>
SCORE
</span>

<strong id="finalScore">
0
</strong>

</div>


<div class="result">

<span>
BEST
</span>

<strong id="bestScore">
0
</strong>

</div>


</div>



<button
id="restartButton"
class="primary-button"
>

RUN AGAIN

</button>


</section>



<!-- =================================
MOBILE CONTROLS
================================== -->

<div id="mobileControls">


<button
id="moveLeft"
class="control-button"
>

←

</button>


<button
id="jump"
class="control-button jump-button"
>

↑

</button>


<button
id="moveRight"
class="control-button"
>

→

</button>


</div>



<!-- =================================
SOUND CONTROL
================================== -->

<button
id="soundButton"
class="sound-button"
>

SOUND ON

</button>


</div>



<script
src="script.js"
></script>


</body>

</html>
